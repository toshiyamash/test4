    <h4 id="chapter2">第2章 建築物の環境衛生（全200問）</h4>
    <p style="font-size: 13px;">テーマと問題番号ボタンはクリック（タップ）すると色が変わります．目印にお使い下さい．右下のリセットボタンで元の色に戻せます．

    <div class="container">
    </div>












    <button id="reset-btn" class="floating-btn">ボタンカラーリセット</button>

    <div id="buttons">
        <a href="index.html" target="_blank">
        <button type="button" class="btn-outline">ホームへ</button>
        </a>
        <a href="sakuin.html" target="_blank">
        <button type="button" class="btn-outline">索引のページへ</button>
        </a>
        <button type="button" class="btn-outline" onclick="location.href='#top'">このページの先頭へ</button>
    </div>


    <style>
        .theme-bgc{
            background-color:rgb(245, 238, 138);
        }

        #top{
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            padding-bottom: 50px;
        }

        .container {
            display: flex;
            gap: 1px;
            flex-wrap: wrap;
        }

        /* 通常時：背景は白 */
        .my-theme {
            padding: 3px 10px;
            margin: 3px 0;
            cursor: pointer;
            background-color: #c7c6c6;
            border: 1px solid #ccc;
            transition: background-color 0.2s;
        }

        /* クリックされて .active クラスがついた時だけ赤くする */
        .my-theme.active {
            background-color: #edb7f8;
            color: black;
            border-color: #edb7f8;
        }        

        /* 通常時：背景は白 */
        .my-question {
            padding: 0px 5px;
            margin: 3px 0;
            cursor: pointer;
            background-color: #9ce8f5;
            border: 1px solid #ccc;
            transition: background-color 0.2s;
        }

        /* クリックされて .active クラスがついた時だけ赤くする */
        .my-question.active {
            background-color: #ff4d4d;
            color: white;
            border-color: #ff4d4d;
        }        

        /* 右下固定のリセットボタン */
        .floating-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            /* padding: 15px 25px; */
            background-color: #333;
            color: white;
            /* border-radius: 50px; */
            /* box-shadow: 0 4px 10px rgba(0,0,0,0.3); */
            cursor: pointer;
            z-index: 1000;
        }
        
        /* ホーム，ページの先頭へボタン */
        #buttons {
            /* 画面の右下に固定 */
            position: fixed;
            left: 20px;
            bottom: 20px;
            
            /* 他の要素より前面に表示 */
            z-index: 9999;
            }
        .btn-outline {
        background-color: white; /* 背景を透明に */
        color: #007bff;                /* 文字色を青に */
        border: 2px solid #007bff;    /* 枠線を青に */
        }

        .btn-outline:hover {
        background-color: #007bff;    /* ホバーで塗りつぶす */
        color: white;
        }

    </style>

    <script>
        // 変数定義
        const items1 = document.querySelectorAll('.my-theme');
        const items2 = document.querySelectorAll('.my-question');
        const resetBtn = document.getElementById('reset-btn');

        // クリックされた「テーマ」だけ背景色変更
        items1.forEach(item => {
            item.addEventListener('click', () => {
                item.classList.add('active');            
            });
        }); 
        
        // クリックされた「問題」だけ背景色変更
        items2.forEach(item => {
        item.addEventListener('click', () => {
            item.classList.add('active');
            });
        }); 
        
        // リセットボタンの処理
        resetBtn.addEventListener('click', () => {
            // 赤くなっている（activeクラスを持つ）ボタンをすべて取得
            const activeButtons = document.querySelectorAll('.my-theme.active,.my-question.active');        
            // すべてのis-activeクラスを取り除く
            activeButtons.forEach(btn => {
                btn.classList.remove('active');
            });
        });        
    </script>
